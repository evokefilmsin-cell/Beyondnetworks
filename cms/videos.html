<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Videos | Beyond Networks CMS</title>

    <link
        rel="stylesheet"
        href="css/dashboard.css">

</head>

<body>

<!-- =====================================
     SIDEBAR
===================================== -->

<aside class="sidebar">

    <div class="sidebar-logo">
        Beyond Networks
    </div>

    <nav>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="articles.html">
            Articles
        </a>

        <a href="article-editor.html">
            New Article
        </a>

        <a href="videos.html"
           class="active">
            Videos
        </a>

        <a href="media.html">
            Media Library
        </a>

        <a href="categories.html">
            Categories
        </a>

        <a href="settings.html">
            Settings
        </a>

    </nav>

</aside>


<!-- =====================================
     MAIN
===================================== -->

<main class="main-content">


    <!-- HEADER -->

    <div class="page-header">

        <div>

            <h1>
                Videos
            </h1>

            <p>
                Manage and publish video stories.
            </p>

        </div>


        <a
            href="video-editor.html"
            class="btn-primary">

            + New Video

        </a>

    </div>


    <!-- =====================================
         FILTERS
    ===================================== -->

    <div class="content-toolbar">

        <input
            type="text"
            id="videoSearch"
            placeholder="Search videos...">


        <select id="videoCategory">

            <option value="">
                All Categories
            </option>

            <option value="Politics">
                Politics
            </option>

            <option value="Business">
                Business
            </option>

            <option value="Technology">
                Technology
            </option>

            <option value="Sports">
                Sports
            </option>

            <option value="Entertainment">
                Entertainment
            </option>

        </select>


        <select id="videoStatus">

            <option value="">
                All Status
            </option>

            <option value="Published">
                Published
            </option>

            <option value="Draft">
                Draft
            </option>

        </select>

    </div>


    <!-- =====================================
         VIDEO TABLE
    ===================================== -->

    <div class="content-card">

        <table class="data-table">

            <thead>

                <tr>

                    <th>
                        Thumbnail
                    </th>

                    <th>
                        Title
                    </th>

                    <th>
                        Category
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Featured
                    </th>

                    <th>
                        Trending
                    </th>

                    <th>
                        Date
                    </th>

                    <th>
                        Actions
                    </th>

                </tr>

            </thead>


            <tbody id="videosTable">

                <tr>

                    <td
                        colspan="8"
                        style="text-align:center;">

                        Loading videos...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</main>


<!-- =====================================
     SUPABASE
===================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/videos.js"></script>

</body>

</html>
