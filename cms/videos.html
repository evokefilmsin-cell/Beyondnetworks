<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Videos | Beyond Networks CMS</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <!-- Dashboard CSS -->
    <link rel="stylesheet" href="css/dashboard.css">

</head>

<body>


<!-- ====================================== -->
<!-- SIDEBAR -->
<!-- ====================================== -->

<div class="sidebar">

    <div class="logo">

        <img
            src="../images/logo.png"
            alt="Beyond Networks"
        >

    </div>


    <a href="dashboard.html">
        🏠 Dashboard
    </a>


    <a href="articles.html">
        📰 Articles
    </a>


    <a href="article-editor.html">
        ✍ New Article
    </a>


    <a
        href="videos.html"
        class="active"
    >
        🎥 Videos
    </a>


    <a href="media.html">
        🖼 Media Library
    </a>


    <a href="categories.html">
        📂 Categories
    </a>


    <a href="settings.html">
        ⚙ Settings
    </a>

</div>



<!-- ====================================== -->
<!-- MAIN -->
<!-- ====================================== -->

<div class="main">


    <!-- ================================== -->
    <!-- PAGE HEADER -->
    <!-- ================================== -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1>
                Videos
            </h1>

            <p class="text-muted mb-0">
                Manage all video content published on Beyond Networks.
            </p>

        </div>


        <a
            href="video-editor.html"
            class="btn btn-danger"
        >

            <i class="bi bi-plus-lg"></i>

            New Video

        </a>

    </div>



    <!-- ================================== -->
    <!-- STATS -->
    <!-- ================================== -->

    <div class="row g-3 mb-4">


        <div class="col-md-4">

            <div class="card p-4">

                <div class="d-flex justify-content-between">

                    <div>

                        <p class="text-muted mb-1">
                            Total Videos
                        </p>

                        <h2
                            id="totalVideos"
                            class="mb-0"
                        >
                            0
                        </h2>

                    </div>


                    <div class="fs-1">
                        🎥
                    </div>

                </div>

            </div>

        </div>



        <div class="col-md-4">

            <div class="card p-4">

                <div class="d-flex justify-content-between">

                    <div>

                        <p class="text-muted mb-1">
                            Published
                        </p>

                        <h2
                            id="publishedVideos"
                            class="mb-0"
                        >
                            0
                        </h2>

                    </div>


                    <div class="fs-1">
                        ✅
                    </div>

                </div>

            </div>

        </div>



        <div class="col-md-4">

            <div class="card p-4">

                <div class="d-flex justify-content-between">

                    <div>

                        <p class="text-muted mb-1">
                            Drafts
                        </p>

                        <h2
                            id="draftVideos"
                            class="mb-0"
                        >
                            0
                        </h2>

                    </div>


                    <div class="fs-1">
                        📝
                    </div>

                </div>

            </div>

        </div>

    </div>



    <!-- ================================== -->
    <!-- VIDEO TABLE -->
    <!-- ================================== -->

    <div class="card p-4">


        <!-- SEARCH -->

        <div class="row mb-4">

            <div class="col-md-6">

                <div class="input-group">

                    <span class="input-group-text">
                        🔍
                    </span>

                    <input
                        type="text"
                        id="searchVideos"
                        class="form-control"
                        placeholder="Search videos..."
                    >

                </div>

            </div>


            <div class="col-md-3">

                <select
                    id="statusFilter"
                    class="form-select"
                >

                    <option value="all">
                        All Status
                    </option>

                    <option value="Published">
                        Published
                    </option>

                    <option value="Draft">
                        Draft
                    </option>

                    <option value="Scheduled">
                        Scheduled
                    </option>

                </select>

            </div>


            <div class="col-md-3">

                <select
                    id="categoryFilter"
                    class="form-select"
                >

                    <option value="all">
                        All Categories
                    </option>

                    <option value="News">
                        News
                    </option>

                    <option value="Politics">
                        Politics
                    </option>

                    <option value="Business">
                        Business
                    </option>

                    <option value="Technology">
                        Technology
                    </option>

                    <option value="Sports">
                        Sports
                    </option>

                    <option value="Entertainment">
                        Entertainment
                    </option>

                </select>

            </div>

        </div>



        <!-- ================================== -->
        <!-- TABLE -->
        <!-- ================================== -->

        <div class="table-responsive">

            <table class="table table-dark table-hover align-middle">

                <thead>

                    <tr>

                        <th>
                            Video
                        </th>

                        <th>
                            Category
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Published
                        </th>

                        <th>
                            Featured
                        </th>

                        <th class="text-end">
                            Actions
                        </th>

                    </tr>

                </thead>


                <tbody id="videosTableBody">

                    <tr>

                        <td
                            colspan="6"
                            class="text-center py-5"
                        >

                            Loading videos...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


    </div>


</div>



<!-- ====================================== -->
<!-- SUPABASE -->
<!-- ====================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/videos.js"></script>


</body>

</html>
