<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Users | Beyond Networks CMS</title>

    <link rel="stylesheet" href="css/cms.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f0f0f;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .users-page {
            padding: 30px;
            max-width: 1400px;
            margin: auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 20px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 28px;
        }

        .page-header p {
            margin: 7px 0 0;
            color: #888;
            font-size: 14px;
        }

        .add-user-btn {
            background: #e50914;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .add-user-btn:hover {
            background: #ff1822;
        }

        .users-card {
            background: #171717;
            border: 1px solid #292929;
            border-radius: 10px;
            overflow: hidden;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th {
            text-align: left;
            padding: 15px 18px;
            background: #1d1d1d;
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .5px;
            border-bottom: 1px solid #292929;
        }

        td {
            padding: 16px 18px;
            border-bottom: 1px solid #242424;
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .user-name {
            font-weight: 600;
        }

        .user-email {
            color: #999;
            font-size: 13px;
            margin-top: 4px;
        }

        .role-badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 5px;
            background: #292929;
            font-size: 12px;
            text-transform: capitalize;
        }

        .role-admin {
            background: rgba(229, 9, 20, .15);
            color: #ff5c64;
        }

        .role-editor {
            background: rgba(80, 140, 255, .15);
            color: #7fa9ff;
        }

        .role-reporter {
            background: rgba(255, 180, 60, .15);
            color: #ffc15c;
        }

        .role-video_editor {
            background: rgba(180, 100, 255, .15);
            color: #c58aff;
        }

        .role-viewer {
            background: rgba(150, 150, 150, .15);
            color: #aaa;
        }

        .edit-role-btn {
            background: transparent;
            color: #aaa;
            border: 1px solid #333;
            border-radius: 5px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 12px;
        }

        .edit-role-btn:hover {
            color: #fff;
            border-color: #666;
        }

        .loading,
        .empty-state {
            padding: 50px;
            text-align: center;
            color: #777;
        }

        .error-message {
            padding: 15px 18px;
            background: rgba(229, 9, 20, .1);
            border-bottom: 1px solid rgba(229, 9, 20, .25);
            color: #ff6b73;
            display: none;
        }

        /* Modal */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 500px;
            background: #181818;
            border: 1px solid #303030;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .close-modal {
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
        }

        .close-modal:hover {
            color: #fff;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            color: #bbb;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            background: #101010;
            border: 1px solid #333;
            color: #fff;
            padding: 11px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #777;
        }

        .form-help {
            margin-top: 6px;
            font-size: 11px;
            color: #666;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 24px;
        }

        .cancel-btn {
            background: #292929;
            border: none;
            color: #ddd;
            padding: 11px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .create-btn {
            background: #e50914;
            border: none;
            color: #fff;
            padding: 11px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .create-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .form-error {
            display: none;
            padding: 10px 12px;
            margin-top: 15px;
            background: rgba(229, 9, 20, .1);
            border: 1px solid rgba(229, 9, 20, .25);
            border-radius: 6px;
            color: #ff6b73;
            font-size: 13px;
        }

        .success-message {
            display: none;
            padding: 10px 12px;
            margin-top: 15px;
            background: rgba(40, 180, 100, .1);
            border: 1px solid rgba(40, 180, 100, .25);
            border-radius: 6px;
            color: #65d695;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            .users-page {
                padding: 20px;
            }

            .page-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .add-user-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="users-page">

        <div class="page-header">
            <div>
                <h1>Users</h1>
                <p>Manage CMS users and their permissions.</p>
            </div>

            <button class="add-user-btn" id="addUserBtn">
                + Add User
            </button>
        </div>

        <div class="users-card">

            <div class="error-message" id="pageError"></div>

            <div class="table-wrapper">

                <table>
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Role</th>
                            <th>Created</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="usersTableBody">
                        <tr>
                            <td colspan="4" class="loading">
                                Loading users...
                            </td>
                        </tr>
                    </tbody>
                </table>

            </div>

        </div>

    </main>


    <!-- ADD USER MODAL -->

    <div class="modal-overlay" id="userModal">

        <div class="modal">

            <div class="modal-header">
                <h2>Add CMS User</h2>

                <button class="close-modal" id="closeModal">
                    ×
                </button>
            </div>

            <form id="userForm">

                <div class="form-group">
                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter full name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="user@example.com"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Minimum 6 characters"
                        minlength="6"
                        required
                    >

                    <div class="form-help">
                        This will be the user's CMS login password.
                    </div>
                </div>


                <div class="form-group">
                    <label for="role">
                        Role
                    </label>

                    <select id="role" required>

                        <option value="viewer">
                            Viewer
                        </option>

                        <option value="reporter">
                            Reporter
                        </option>

                        <option value="video_editor">
                            Video Editor
                        </option>

                        <option value="editor">
                            Editor
                        </option>

                        <option value="admin">
                            Admin
                        </option>

                    </select>
                </div>


                <div class="form-error" id="formError"></div>

                <div class="success-message" id="formSuccess"></div>


                <div class="modal-actions">

                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancelBtn"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="create-btn"
                        id="createBtn"
                    >
                        Create User
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/users.js"></script>

</body>
</html>
