<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Media Library | Beyond Networks CMS</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet">

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<link
    rel="stylesheet"
    href="css/dashboard.css">

<style>

/* ======================================
   MEDIA LIBRARY
====================================== */

.media-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 25px;
    flex-wrap: wrap;
}

.media-search {
    max-width: 400px;
}

.media-grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
}

.media-card {
    background: #1c1f22;
    border: 1px solid #343a40;
    border-radius: 12px;
    overflow: hidden;
    transition: 0.2s ease;
}

.media-card:hover {
    border-color: #666;
    transform: translateY(-2px);
}

.media-image-wrapper {
    width: 100%;
    height: 180px;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.media-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    cursor: pointer;
}

.media-info {
    padding: 14px;
}

.media-name {
    color: #fff;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.media-details {
    color: #888;
    font-size: 13px;
    margin-top: 5px;
}

.media-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.media-actions button {
    flex: 1;
}

.upload-area {
    border: 2px dashed #444;
    border-radius: 12px;
    padding: 30px;
    text-align: center;
    background: #16181a;
    margin-bottom: 25px;
    transition: 0.2s ease;
}

.upload-area:hover {
    border-color: #777;
}

.upload-icon {
    font-size: 38px;
    margin-bottom: 10px;
}

#mediaUpload {
    display: none;
}

</style>

</head>

<body>

<!-- ======================================
     SIDEBAR
====================================== -->

<div class="sidebar">

    <div class="logo">
        <img src="../images/logo.png">
    </div>

    <a href="dashboard.html">
        <i class="bi bi-grid-fill"></i>
        Dashboard
    </a>

    <a href="articles.html">
        <i class="bi bi-newspaper"></i>
        Articles
    </a>

    <a href="article-editor.html">
        <i class="bi bi-pencil-square"></i>
        New Article
    </a>

    <a href="videos.html">
        <i class="bi bi-camera-reels"></i>
        Videos
    </a>

    <a href="media.html" class="active">
        <i class="bi bi-images"></i>
        Media Library
    </a>

    <a href="categories.html">
        <i class="bi bi-folder2-open"></i>
        Categories
    </a>

    <a href="settings.html">
        <i class="bi bi-gear-fill"></i>
        Settings
    </a>

</div>


<!-- ======================================
     MAIN
====================================== -->

<div class="main">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1>Media Library</h1>

            <p class="text-secondary">
                Upload and manage images for Beyond Networks
            </p>

        </div>

    </div>


    <!-- ======================================
         UPLOAD
    ====================================== -->

    <div class="upload-area">

        <div class="upload-icon">
            <i class="bi bi-cloud-arrow-up"></i>
        </div>

        <h4>
            Upload Images
        </h4>

        <p class="text-secondary mb-3">
            Upload images to your Beyond Networks media library
        </p>

        <label
            for="mediaUpload"
            class="btn btn-danger">

            <i class="bi bi-plus-circle"></i>
            Choose Images

        </label>

        <input
            type="file"
            id="mediaUpload"
            accept="image/*"
            multiple>

    </div>


    <!-- ======================================
         TOOLBAR
    ====================================== -->

    <div class="media-toolbar">

        <div>

            <h4 class="mb-0">
                All Media
            </h4>

            <small class="text-secondary">
                Your uploaded images
            </small>

        </div>


        <div class="media-search">

            <div class="input-group">

                <span class="input-group-text bg-dark border-secondary text-white">
                    <i class="bi bi-search"></i>
                </span>

                <input
                    type="text"
                    id="mediaSearch"
                    class="form-control bg-black text-white border-secondary"
                    placeholder="Search media...">

            </div>

        </div>

    </div>


    <!-- ======================================
         MEDIA GRID
    ====================================== -->

    <div
        id="mediaGrid"
        class="media-grid">

    </div>

</div>


<!-- ======================================
     IMAGE PREVIEW MODAL
====================================== -->

<div
    class="modal fade"
    id="mediaPreviewModal"
    tabindex="-1"
    aria-hidden="true">

    <div class="modal-dialog modal-xl modal-dialog-centered">

        <div class="modal-content bg-dark border-secondary">

            <div class="modal-header border-secondary">

                <h5 class="modal-title">
                    Image Preview
                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body text-center">

                <img
                    id="previewImage"
                    src=""
                    alt="Preview"
                    style="
                        max-width:100%;
                        max-height:75vh;
                        object-fit:contain;
                        border-radius:8px;
                    ">

            </div>

        </div>

    </div>

</div>


<!-- ======================================
     SCRIPTS
====================================== -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/auth.js"></script>

<script src="js/media.js"></script>

</body>

</html>
