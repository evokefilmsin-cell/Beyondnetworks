<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Article Preview | Beyond Networks</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<style>

body{

    background:#0f0f0f;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;

}

.preview-container{

    max-width:1000px;
    margin:auto;
    padding:40px 20px;

}

.preview-card{

    background:#181818;
    border:1px solid #333;
    border-radius:15px;
    overflow:hidden;

}

.preview-image{

    width:100%;
    max-height:450px;
    object-fit:cover;

}

.preview-content{

    padding:40px;

}

.category{

    display:inline-block;

    background:#ff3b3b;

    color:#fff;

    padding:6px 14px;

    border-radius:30px;

    font-size:14px;

    margin-bottom:20px;

}

h1{

    font-size:42px;

    font-weight:bold;

    margin-bottom:20px;

}

.meta{

    color:#999;

    margin-bottom:30px;

}

.summary{

    font-size:20px;

    color:#ddd;

    margin-bottom:30px;

}

.article-body{

    line-height:1.9;

    font-size:18px;

}

.article-body img{

    max-width:100%;

}

.article-body table{

    width:100%;

    border-collapse:collapse;

}

.article-body table,
.article-body td,
.article-body th{

    border:1px solid #444;

    padding:10px;

}

.article-body blockquote{

    border-left:5px solid #ff3b3b;

    padding-left:20px;

    color:#ccc;

}

.seo-box{

    margin-top:50px;

    background:#202020;

    border-radius:10px;

    padding:20px;

}

.buttons{

    display:flex;

    justify-content:center;

    gap:20px;

    margin-top:40px;

}

</style>

</head>

<body>

<div class="preview-container">

<div class="preview-card">

<img
id="previewImage"
class="preview-image"
src="../images/logo.png">

<div class="preview-content">

<div
id="previewCategory"
class="category">

News

</div>

<h1 id="previewTitle">

Loading...

</h1>

<div
class="meta">

<span id="previewAuthor"></span>

•

<span id="previewDate"></span>

</div>

<div
id="previewSummary"
class="summary">

</div>

<div
id="previewContent"
class="article-body">

</div>

<div class="seo-box">

<h4>SEO Preview</h4>

<hr>

<p>

<strong>SEO Title</strong>

</p>

<p id="seoTitle"></p>

<p>

<strong>Meta Description</strong>

</p>

<p id="metaDescription"></p>

</div>

<div class="buttons">

<button
class="btn btn-secondary btn-lg"
onclick="window.close()">

<i class="bi bi-arrow-left"></i>

Back to Editor

</button>

<button
class="btn btn-danger btn-lg"
onclick="window.close()">

<i class="bi bi-send"></i>

Continue Editing

</button>

</div>

</div>

</div>

</div>

<script>

const article =
JSON.parse(
localStorage.getItem("previewArticle")
);

if(article){

document.getElementById("previewTitle").innerText =
article.title;

document.getElementById("previewSummary").innerText =
article.summary;

document.getElementById("previewCategory").innerText =
article.category;

document.getElementById("previewAuthor").innerText =
article.author;

document.getElementById("previewDate").innerText =
article.publishDate || "Not Scheduled";

document.getElementById("previewContent").innerHTML =
article.content;

document.getElementById("seoTitle").innerText =
article.seoTitle;

document.getElementById("metaDescription").innerText =
article.metaDescription;

if(article.image){

document.getElementById("previewImage").src =
article.image;

}

}

</script>

</body>

</html>
