<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CMS Login | Beyond Networks</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: #fff;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-box {
            background: #181818;
            border: 1px solid #2d2d2d;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            margin: 0;
            font-size: 28px;
        }

        .logo span {
            color: #ff4040;
        }

        .logo p {
            color: #999;
            margin-top: 8px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ccc;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #101010;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #ff4040;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #ff4040;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #e93636;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: rgba(255, 64, 64, 0.12);
            border: 1px solid rgba(255, 64, 64, 0.3);
            color: #ff7070;
            font-size: 14px;
        }

        .success {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: rgba(60, 200, 120, 0.12);
            border: 1px solid rgba(60, 200, 120, 0.3);
            color: #6ee7a0;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .login-box {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <div class="logo">
            <h1>Beyond<span>Networks</span></h1>
            <p>CMS Administration</p>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" id="loginButton">
                Login
            </button>

            <div class="error" id="loginError"></div>

            <div class="success" id="loginSuccess">
                Login successful. Redirecting...
            </div>

        </form>

    </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
