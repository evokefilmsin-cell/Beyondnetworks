<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title id="pageTitle">Beyond Networks</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="topbar">

<div class="logo">
<img src="images/logo.png">
</div>

<nav>

<a href="index.html">Home</a>
<a href="videos.html">Videos</a>
<a href="politics.html">Politics</a>
<a href="business.html">Business</a>
<a href="technology.html">Technology</a>
<a href="sports.html">Sports</a>
<a href="entertainment.html">Entertainment</a>

</nav>

</header>



<!-- BREAKING TICKER -->

<div class="breaking-news">

<div class="breaking-label">
BREAKING
</div>

<div id="breakingTicker"></div>

</div>



<main class="article-page">

    <!-- LEFT COLUMN -->
    <aside class="article-left">

        <div class="latest-box">
            <h2>Latest News</h2>

            <div id="latestNewsArticle">
                Loading...
            </div>

        </div>

    </aside>


    <!-- MAIN ARTICLE -->

    <article class="article-main">

        <span id="articleCategory" class="article-category">
            NEWS
        </span>

        <h1 id="articleTitle">
            Loading...
        </h1>

        <div class="article-meta">

            <span id="articleAuthor">
                Beyond News Digital
            </span>

            <span>•</span>

            <span id="articleDate">
                Loading...
            </span>

            <span>•</span>

            <span id="articleReadTime">
                5 min read
            </span>

        </div>


        <img
    id="articleImage"
    class="article-image"
    src=""
    alt="Article Image">

        <p class="image-caption" id="imageCaption">
            Featured Image
        </p>


        <div class="share-bar">

            <button id="shareFacebook">Facebook</button>
<button id="shareX">X</button>
<button id="shareWhatsapp">WhatsApp</button>
<button id="shareTelegram">Telegram</button>
<button id="copyLink">Copy Link</button>

        </div>


        <div
            id="articleContent"
            class="article-content">
        </div>


       <div
    id="articleTags"
    class="article-tags">
</div>

    </article>


    <!-- RIGHT COLUMN -->

    <aside class="article-right">

        <div class="trending-box">

            <h2>Trending Now</h2>

            <div id="trendingNewsArticle">

                Loading...

            </div>

        </div>

    </aside>

</main>



<section class="related-section">

<h2>Related Stories</h2>

<div
id="relatedStories"
class="related-grid">

</div>

</section>



<footer class="footer">

<div class="footer-bottom">

<p>

© 2026 BeyondNetworks

</p>

</div>

</footer>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="cms/js/supabase.js"></script>

<script src="cms/js/article.js"></script>
<script src="theme.js"></script>

</body>

</html>
