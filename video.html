<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Video | Beyond Networks</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="cms/js/supabase.js"></script>

</head>


<body>

====================================== -->

    <div class="logo">

        <img
            src="images/logo.png"
            alt="Beyond Networks">

    </div>


    <nav>

        <a href="index.html">Home</a>

        <a href="videos.html">Videos</a>

        <a href="politics.html">Politics</a>

        <a href="sports.html">Sports</a>

        <a href="entertainment.html">Entertainment</a>

    </nav>

</header>



<!-- ======================================
     VIDEO PAGE
====================================== -->

<main class="single-video-page">

    <div id="videoContainer">

        Loading...

    </div>

</main>



<script>

const params =
    new URLSearchParams(window.location.search);

const slug =
    params.get("slug");


async function loadVideo() {

    if (!slug) {

        document.getElementById("videoContainer").innerHTML =
            "<p>Video not found.</p>";

        return;

    }


    const { data, error } =
        await supabaseClient

            .from("articles")

            .select("*")

            .eq("slug", slug)

            .eq("is_video", true)

            .eq("status", "Published")

            .single();


    if (error) {

        console.error(error);

        document.getElementById("videoContainer").innerHTML =
            "<p>Unable to load video.</p>";

        return;

    }


    const videoId =
        getYouTubeId(data.video_url);


    if (!videoId) {

        document.getElementById("videoContainer").innerHTML =
            "<p>Invalid YouTube URL.</p>";

        return;

    }


    document.title =
        data.title + " | Beyond Networks";


    document.getElementById("videoContainer").innerHTML = `

        <div class="single-video-wrapper">

            <div class="youtube-player">

                <iframe

                    src="https://www.youtube.com/embed/${videoId}"

                    title="${data.title}"

                    frameborder="0"

                    allow="accelerometer;
                    autoplay;
                    clipboard-write;
                    encrypted-media;
                    gyroscope;
                    picture-in-picture;
                    web-share"

                    allowfullscreen>

                </iframe>

            </div>


            <div class="single-video-content">

                <span>
                    ${data.category}
                </span>

                <h1>
                    ${data.title}
                </h1>

                <p>
                    ${data.summary || ""}
                </p>

            </div>

        </div>

    `;

}


function getYouTubeId(url) {

    if (!url) return null;


    try {

        const parsed =
            new URL(url);


        if (
            parsed.hostname.includes("youtube.com")
        ) {

            return parsed.searchParams.get("v");

        }


        if (
            parsed.hostname.includes("youtu.be")
        ) {

            return parsed.pathname
                .replace("/", "");

        }

    } catch (error) {

        console.error(error);

    }


    return null;

}


loadVideo();

</script>


</body>

</html>
